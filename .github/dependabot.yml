version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # 13.x ships no prebuilt binaries, see CLAUDE.md.
    ignore:
      - dependency-name: "better-sqlite3"
        versions: [">=13"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
