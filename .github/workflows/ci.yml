name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded PR runs, but let every run on main finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    # Squash merges use the PR title as the commit that release-please reads.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install commitlint
        run: pnpm install --frozen-lockfile --filter projectbench

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: No private host names
        run: |
          # Real deployment hosts are injected from env/secrets, never committed.
          if git grep -nIE '[A-Za-z0-9-]+\.herrmann\.ltd' -- .; then
            echo "::error::Private host name committed. Use an example.com placeholder and inject the real value."
            exit 1
          fi

      - name: Set up pnpm
        # Version comes from package.json `packageManager` — do not
        # also set `version:` here, pnpm/action-setup@v6 refuses both.
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Build container image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: projectbench:ci
